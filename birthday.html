<!DOCTYPE html>//
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1027;--bg2:#2d1738;--ink:#fff3ee;--soft:#e8cfdc;--rose:#ff9db8;--gold:#ffd89b;--lilac:#c3a4ff;
--serif:"Cormorant Garamond",Georgia,serif;--hand:"Caveat","Segoe Script",cursive;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 20% 10%,var(--bg2),var(--bg) 60%);color:var(--ink);font-family:var(--sans);overflow:hidden}
canvas{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:50}
.page{position:fixed;inset:0;padding:40px 24px 110px;overflow-y:auto;display:none;z-index:1}
.page.on{display:block;animation:in .7s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:scale(.985) translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
h2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(2.2rem,6vw,3.6rem);text-align:center;margin-bottom:.3em}
.sub{font-family:var(--hand);font-size:1.6rem;color:var(--gold);text-align:center;margin-bottom:2rem}
/* nav */
nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:40px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);max-width:96vw;overflow-x:auto}
nav button{background:none;border:0;color:var(--soft);font:500 .85rem var(--sans);padding:10px 14px;border-radius:30px;cursor:pointer;white-space:nowrap;transition:.25s}
nav button:hover{color:#fff}
nav button.on{background:linear-gradient(135deg,var(--rose),var(--lilac));color:#2a1230}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#music{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:1.1rem;cursor:pointer;display:none}
.ph{position:relative;background:linear-gradient(135deg,#5b2a63,#c4577f 60%,#ffb48a);overflow:hidden;display:grid;place-items:center;font-size:2.4rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* home */
.hero{text-align:center}
.hero .hb{font-family:var(--hand);font-size:clamp(1.6rem,4vw,2.4rem);color:var(--gold)}
.hero h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(4.5rem,19vw,12rem);line-height:.95;letter-spacing:-.02em;background:linear-gradient(100deg,var(--rose),var(--gold) 50%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent;padding:.05em .1em}
.hero p{max-width:34ch;margin:1.2rem auto 2rem;color:var(--soft);font-size:1.1rem;line-height:1.7}



.portrait {
  width: min(240px, 60vw);
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  margin: 0 auto 1.4rem;
  border: 3px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 0 0 10px rgba(255, 157, 184, 0.15),
              0 20px 60px rgba(255, 120, 170, 0.3);
}

.portrait img {
  position: absolute;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: cover;
  object-position: center;
  display: block;
}

/* Make the inner wrapper fill the circular portrait */
.portrait > .ph {
  width: 100%;
  height: 100%;
}


.btn{font:500 1rem var(--sans);border:0;border-radius:40px;padding:14px 30px;cursor:pointer;color:#2a1230;background:linear-gradient(135deg,var(--gold),var(--rose));box-shadow:0 10px 30px rgba(255,157,184,.35);transition:.25s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
/* story */
.tl{position:relative;max-width:760px;margin:0 auto}
.tl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(var(--rose),var(--lilac));opacity:.5}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin:0 0 38px;position:relative}
.ev:before{content:"";position:absolute;left:50%;top:22px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 6px rgba(255,216,155,.2)}
.ev .t{padding:6px 0}.ev:nth-child(even) .t{order:2}.ev:nth-child(odd) .t{text-align:right}
.ev .d{font-family:var(--hand);color:var(--gold);font-size:1.5rem}
.ev h3{font-family:var(--serif);font-size:1.7rem;font-weight:600;margin:.1em 0 .3em}
.ev p{color:var(--soft);line-height:1.65}
.ev .ph{border-radius:16px;aspect-ratio:4/3}
/* gallery */
.pol{columns:3 230px;column-gap:26px;padding:10px}
.pl{break-inside:avoid;background:#fffaf5;padding:12px 12px 14px;margin-bottom:30px;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.4);transform:rotate(var(--r));transition:transform .35s;cursor:zoom-in;color:#3a2230;text-align:center}
.pl:hover{transform:rotate(0) scale(1.04);z-index:3;position:relative}
.pl .ph{aspect-ratio:var(--ar,1)}
.pl span{display:block;font-family:var(--hand);font-size:1.45rem;margin-top:10px}
#lb{position:fixed;inset:0;z-index:60;background:rgba(10,4,16,.92);display:none;place-items:center;padding:20px;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:84vh;border-radius:6px}
#lb p{font-family:var(--hand);font-size:1.8rem;text-align:center;margin-top:12px}
/* reasons */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
.fc{perspective:900px;height:190px;cursor:pointer;background:none;border:0;color:inherit;font:inherit}
.fc i{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;padding:22px;text-align:center;backface-visibility:hidden;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.fc{position:relative}
.fc .a{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-family:var(--serif);font-style:italic;font-size:1.5rem;font-weight:600}
.fc .b{background:linear-gradient(135deg,var(--rose),var(--lilac));color:#2a1230;transform:rotateY(180deg);font-style:normal;font-size:1.02rem;line-height:1.5}
.fc.f .a{transform:rotateY(-180deg)}.fc.f .b{transform:rotateY(0)}
/* letter */
.env{width:min(420px,88vw);margin:0 auto;text-align:center}
.env button{width:100%;aspect-ratio:3/2;border:0;border-radius:14px;background:linear-gradient(135deg,#f6c3a9,#f19aa8);color:#6b2540;font:600 2rem var(--hand);cursor:pointer;box-shadow:0 24px 60px rgba(0,0,0,.4);position:relative;overflow:hidden}
.env button:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,rgba(255,255,255,.25) 50%) , linear-gradient(to bottom left,transparent 49%,rgba(255,255,255,.18) 50%);background-size:100% 62%;background-repeat:no-repeat}
.env button span{position:relative}
.paper{display:none;max-width:640px;margin:0 auto;background:#fffaf2;color:#3b2430;border-radius:6px;padding:clamp(26px,5vw,52px);box-shadow:0 30px 70px rgba(0,0,0,.5);transform:rotate(-.6deg);background-image:repeating-linear-gradient(transparent 0 33px,rgba(200,120,140,.14) 33px 34px)}
.paper.on{display:block;animation:in .8s}
.paper p{font-family:var(--hand);font-size:1.6rem;line-height:34px;margin-bottom:34px;opacity:0;animation:fade .9s forwards}
@keyframes fade{to{opacity:1}}
/* cake */
.cake{text-align:center}
.cakebox{position:relative;width:240px;height:230px;margin:30px auto 20px}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 8px 8px}
.t1{bottom:0;width:240px;height:90px;background:linear-gradient(#ff9db8,#e7668f)}
.t2{bottom:90px;width:170px;height:70px;background:linear-gradient(#ffe2b8,#ffc27d)}
.t1:after,.t2:after{content:"";position:absolute;top:0;left:0;right:0;height:22px;background:radial-gradient(circle at 14px 0,#fff 14px,transparent 15px) 0 0/28px 22px repeat-x;border-radius:14px 14px 0 0}
.candles{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);display:flex;gap:22px}
.cd{width:10px;height:44px;background:repeating-linear-gradient(45deg,#fff 0 6px,var(--lilac) 6px 12px);border-radius:3px;position:relative}
.cd b{position:absolute;left:50%;top:-24px;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff,#ffd36b 50%,#ff8a3d);box-shadow:0 0 24px 8px rgba(255,190,90,.6);animation:fl .35s infinite alternate}
@keyframes fl{to{transform:scale(.9,1.12) rotate(4deg)}}
.out .cd b{display:none}
.wish{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,4vw,2.2rem);max-width:30ch;margin:0 auto;min-height:3em;opacity:0;transition:opacity 1.2s}
.out .wish{opacity:1}
@media(max-width:640px){.tl:before{left:14px}.ev{grid-template-columns:1fr;gap:12px;padding-left:40px}.ev:before{left:14px}.ev:nth-child(even) .t{order:0}.ev:nth-child(odd) .t{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<button id="music" aria-label="Toggle music">♪</button>
<main id="app"></main>
<nav id="nav" aria-label="Pages"></nav>
<div id="lb"><div><img id="lbi" alt=""><p id="lbc"></p></div></div>

<script>
/* =====================================================================
   ✏️  EDIT EVERYTHING HERE — you never need to touch the code below.
   • Images: put photos in the same folder as this file and write the
     file name, e.g. "photos/us1.jpg". Leave "" to show a pretty
     placeholder. You can also paste full web links (https://…).
   • Add or remove items in any list by copying/deleting a { … } line.
   ===================================================================== */
const C = {
  name: "Navamy",                       // her name (or nickname)
  from: "Albin",                        // your name, shown at the end of the letter
  greeting: "Happy Birthday",
  tagline: "Another year around the sun, and I’m still the luckiest person to spend it with you.",

  portrait: "https://drive.google.com/thumbnail?id=1VWyduDPwDIeiaC6K2ekkUZSDf3a-gNHZ&sz=w1000",                        // her main photo, e.g. "photos/her.jpg"

  music: "",                           // optional song file, e.g. "song.mp3" (leave "" for none)
  candles: 3,                          // number of candles on the cake (1–8)

  story: [                             // Our Story page — timeline
    { date: "The day we met", title: "Hello, you", text: "I didn’t know it yet, but my whole life was about to change.", image: "https://drive.google.com/thumbnail?id=1zArX5aGyneRO2zq4xzboVrL3yH9MQQzF&sz=w1000" }, //https://drive.google.com/file/d/1jdFj8ZU96DkKMmcarJRItKqwlUC-_s8C/view?usp=drive_link
    { date: "That meet", title: "Our second meet", text: "Azikode beach, best day. We managed to capture the moment perfectly.", image: "https://drive.google.com/thumbnail?id=1fXEJSKCP4d80uyKTEA0x1NAiJFCvazqx&sz=w1000" },
    { date: "Dubai", title: "The night became colorful", text: "We made the night perfect in the boat", image: "https://drive.google.com/thumbnail?id=1jdFj8ZU96DkKMmcarJRItKqwlUC-_s8C&sz=w1000" },
     { date: "Right after fight", title: "Ups and downs", text: "We had a fight for some reason and then we made up.", image: "https://drive.google.com/thumbnail?id=1Lv6x_e4w7Hg3Khky4hp9xwvL2iVKmUhb&sz=w1000" }

  ],

  photos: [                            // Gallery page — polaroids
    { src: "https://drive.google.com/thumbnail?id=1OtFM7yH-8Uwe2xWdH3-44ardSQ2KteE2&sz=w1000", caption: "Rainy day in kattadikadavu" },
{ src: "https://drive.google.com/thumbnail?id=1SKAVhJHel4yhwtINypOqykb6vPZPYxnT&sz=w1000", caption: "Fud time" },
{ src: "https://drive.google.com/thumbnail?id=1Gr5gd-Cvl-Q0Kfgqh7UiBKEN22w6JlBQ&sz=w1000", caption: "Peruvanmala" },
{ src: "https://drive.google.com/thumbnail?id=1UB3yqFKstfQr6Kmu7uRS-AqV05kh7zvi&sz=w1000", caption: "Silly us" },
{ src: "https://drive.google.com/thumbnail?id=1Tz-ND_TbTMm4As2mei9KkwXURzcrI81b&sz=w1000", caption: "tiered us" },
{ src: "https://drive.google.com/thumbnail?id=1V-5jVFZZsrF0VRG0-2QQnAD0-NKhvMdB&sz=w1000", caption: "Selfie time" },
{ src: "https://drive.google.com/thumbnail?id=1z00gG08te_C5-lRTsxTJzSMQW3v2MkfQ&sz=w1000", caption: "Snap time" },
{ src: "https://drive.google.com/thumbnail?id=1Flzk3ADRCyYwaJ4UDttsWLbDVUDCk8Tb&sz=w1000", caption: "Our bike ride" },
{ src: "https://drive.google.com/thumbnail?id=1JwFj_FqbYj1mGgDz4dv9gbeecgiaN613&sz=w1000", caption: "Long conversation" },
{ src: "https://drive.google.com/thumbnail?id=11cVnPbhqn2PpXrsiMKx2Vdin02gJMOHw&sz=w1000", caption: "chilling with the sun" },
{ src: "https://drive.google.com/thumbnail?id=1w50F-W-IzoH8forCt_ufEgaLCjgSdbR3&sz=w1000", caption: "Dubai Mall" },
{ src: "https://drive.google.com/thumbnail?id=1_Ya5wLGg8K4zd-GgHgaXvFk5PL8KFIR1&sz=w1000", caption: "Trip time" },
{ src: "https://drive.google.com/thumbnail?id=1f5UXcHwsw7AbH8-UVPOyB8jbBJqCU6BH&sz=w1000", caption: "Inside the zoo" },
{ src: "https://drive.google.com/thumbnail?id=1658EnBvphcwj3ozfEuqH7HFirRV6q-Yh&sz=w1000", caption: "Reunited after long time" },
{ src: "https://drive.google.com/thumbnail?id=1TUZOUvgUCmS5rVijf70lleiFp3TgF-Pj&sz=w1000", caption: "When tallest building met us" },
//{ src: "https://drive.google.com/thumbnail?id=1Lv6x_e4w7Hg3Khky4hp9xwvL2iVKmUhb&sz=w1000", caption: "12" },
  ],




  reasons: [                           // Reasons page — tap a card to flip it
    { front: "Your laugh", back: "നീ അങ്ങനെ ചിരിക്കില്ല, പക്ഷേ നീ ചിരിച്ചാൽ ഒരു രക്ഷയുമില്ല" },
    { front: "Your kindness", back: "നിനക്ക് ചുറ്റുമുള്ളവർക്ക് നീ പ്രാധന്യം കൊടുക്കും" },
    { front: "Your courage", back: "മാറ്റരും കടന്ന് പോവാത്ത സഹജര്യത്തിലും നീ ശക്തമായി അതിജീവിച്ച് വന്നു" },
    { front: "Your hugs", back: "ഇതിനുശേഷം എല്ലാം ശരിയാവും എന്ന് ഒരു തോന്നൽ വരും" },
    { front: "Your silliness", back: "എന്നെ ചിരിപ്പിക്കാൻ ഇത് മതി" },
    { front: "Simply you", back: "I love you the way you are bf" }
  ],

  letter: [                            // Letter page — one line per paragraph
    "Dear Navamy,",
    "Today is all about you, and I wanted to give you something that’s just as unique as you are.",
    "Thank you for every laugh, every late-night talk and every ordinary day you made special.",
    "I promise more adventures, more terrible jokes, and a lot more fights.",
    "Happy birthday. I love you more than I can fit on one page."
  ],

  wish: "May this year bring you everything you’ve been dreaming of. 💖"
};
/* ===================== END OF EDITABLE PART ===================== */

const $ = (s, r = document) => r.querySelector(s);
const ph = (src, emoji = "💗") => `<div class="ph">${emoji}${src ? `<img src="${src}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;

const pages = [
  ["home", "🎂 Home"], ["story", "📖 Our Story"], ["gallery", "📸 Memories"],
  ["reasons", "💌 Reasons"], ["letter", "✉️ Letter"], ["cake", "🕯️ Make a Wish"]
];

const html = {
  home: `<div class="wrap hero"><div class="portrait">${ph(C.portrait, "👩")}</div>
    <div class="hb">${C.greeting}</div><h1>${C.name}</h1><p>${C.tagline}</p>
    <div><button class="btn" id="confettiBtn">Celebrate 🎉</button></div></div>`,

  story: `<div class="wrap"><h2>Our Story</h2><div class="sub">the chapters so far</div><div class="tl">
    ${C.story.map(e => `<div class="ev"><div class="t"><div class="d">${e.date}</div><h3>${e.title}</h3><p>${e.text}</p></div>${ph(e.image, "✨")}</div>`).join("")}</div></div>`,

  gallery: `<div class="wrap"><h2>Our Memories</h2><div class="sub">tap a photo to see it bigger</div><div class="pol">
    ${C.photos.map((p, i) => `<div class="pl" data-i="${i}" style="--r:${[-3, 2.5, -1.5, 3, -2.5, 1.5][i % 6]}deg;--ar:${[1, 4 / 5, 1, 5 / 4, 4 / 5, 1][i % 6]}" tabindex="0" role="button">${ph(p.src, "📷")}<span>${p.caption}</span></div>`).join("")}</div></div>`,

  reasons: `<div class="wrap"><h2>Reasons I Love You</h2><div class="sub">tap to flip each card</div><div class="cards">
    ${C.reasons.map(r => `<button class="fc"><i class="a">${r.front}</i><i class="b">${r.back}</i></button>`).join("")}</div></div>`,

  letter: `<div class="wrap"><h2>A Letter For You</h2><div class="sub">just for your eyes</div>
    <div class="env" id="env"><button id="open"><span>Tap to open 💌</span></button></div>
    <div class="paper" id="paper">${C.letter.map((t, i) => `<p style="animation-delay:${i * 1.1 + .4}s">${t}</p>`).join("")}<p style="animation-delay:${C.letter.length * 1.1 + .4}s;text-align:right">Forever yours,<br>${C.from} ♥</p></div></div>`,

  cake: `<div class="wrap cake" id="cake"><h2>Make a Wish</h2><div class="sub">close your eyes, then blow out the candles</div>
    <div class="cakebox"><div class="candles">${"<div class='cd'><b></b></div>".repeat(Math.min(8, Math.max(1, C.candles)))}</div><div class="tier t2"></div><div class="tier t1"></div></div>
    <p class="wish">${C.wish}</p><div style="margin-top:22px"><button class="btn" id="blow">Blow the candles 💨</button></div></div>`
};

const app = $("#app"), nav = $("#nav");
pages.forEach(([id, label]) => {
  app.insertAdjacentHTML("beforeend", `<section class="page" id="p-${id}">${html[id]}</section>`);
  nav.insertAdjacentHTML("beforeend", `<button data-id="${id}">${label}</button>`);
});

function go(id) {
  if (!html[id]) id = "home";
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + id));
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  $("#p-" + id).scrollTop = 0;
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
nav.onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.id); };
addEventListener("keydown", e => {
  const i = pages.findIndex(p => p[0] === (location.hash.slice(1) || "home"));
  if (e.key === "ArrowRight") go(pages[Math.min(i + 1, pages.length - 1)][0]);
  if (e.key === "ArrowLeft") go(pages[Math.max(i - 1, 0)][0]);
  if (e.key === "Escape") $("#lb").classList.remove("on");
});

/* gallery lightbox */
document.addEventListener("click", e => {
  const pl = e.target.closest(".pl");
  if (pl) {
    const p = C.photos[pl.dataset.i];
    $("#lbi").style.display = p.src ? "" : "none"; $("#lbi").src = p.src || "";
    $("#lbc").textContent = p.caption; $("#lb").classList.add("on");
  } else if (e.target.closest("#lb")) $("#lb").classList.remove("on");
  const fc = e.target.closest(".fc"); if (fc) fc.classList.toggle("f");
});

/* letter */
$("#open").onclick = () => { $("#env").style.display = "none"; $("#paper").classList.add("on"); burst(innerWidth / 2, innerHeight / 3, 40); };

/* cake */
$("#blow").onclick = () => {
  $("#cake").classList.add("out"); $("#blow").disabled = true; $("#blow").style.opacity = .5;
  for (let i = 0; i < 5; i++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * .3, 60), i * 250);
};
$("#confettiBtn").onclick = () => { for (let i = 0; i < 4; i++) setTimeout(() => burst(innerWidth * (.2 + i * .2), innerHeight * .35, 70), i * 200); };

/* music */
if (C.music) {
  const a = new Audio(C.music), m = $("#music"); a.loop = true; m.style.display = "block";
  m.onclick = () => { a.paused ? (a.play(), m.textContent = "❚❚") : (a.pause(), m.textContent = "♪"); };
}

/* floating hearts background + confetti */
const bg = $("#bg"), fx = $("#fx"), b = bg.getContext("2d"), f = fx.getContext("2d");
let W, H, hearts = [], bits = [];
const size = () => { W = bg.width = fx.width = innerWidth; H = bg.height = fx.height = innerHeight; };
size(); addEventListener("resize", size);
for (let i = 0; i < 28; i++) hearts.push({ x: Math.random() * 2000, y: Math.random() * 1200, s: 8 + Math.random() * 18, v: .25 + Math.random() * .5, o: .06 + Math.random() * .16, p: Math.random() * 6 });
function heart(c, x, y, s) { c.beginPath(); c.moveTo(x, y + s / 4); c.bezierCurveTo(x, y - s / 4, x - s / 2, y - s / 4, x - s / 2, y + s / 4); c.bezierCurveTo(x - s / 2, y + s * .6, x, y + s * .8, x, y + s); c.bezierCurveTo(x, y + s * .8, x + s / 2, y + s * .6, x + s / 2, y + s / 4); c.bezierCurveTo(x + s / 2, y - s / 4, x, y - s / 4, x, y + s / 4); c.fill(); }
function burst(x, y, n) { const cols = ["#ff9db8", "#ffd89b", "#c3a4ff", "#fff3ee", "#ff7aa2"]; for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = 3 + Math.random() * 7; bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, c: cols[i % 5], s: 5 + Math.random() * 7, l: 1, h: Math.random() < .35 }); } }
(function loop(t) {
  b.clearRect(0, 0, W, H); b.fillStyle = "#ff9db8";
  hearts.forEach(h => { h.y -= h.v; if (h.y < -40) { h.y = H + 40; h.x = Math.random() * W; } b.globalAlpha = h.o; heart(b, h.x + Math.sin(t / 1500 + h.p) * 20, h.y, h.s); });
  f.clearRect(0, 0, W, H);
  bits = bits.filter(p => p.l > 0);
  bits.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .99; p.l -= .008; f.globalAlpha = Math.max(p.l, 0); f.fillStyle = p.c; p.h ? heart(f, p.x, p.y, p.s * 1.6) : f.fillRect(p.x, p.y, p.s, p.s * .6); });
  requestAnimationFrame(loop);
})(0);

go(location.hash.slice(1) || "home");
addEventListener("hashchange", () => go(location.hash.slice(1)));
setTimeout(() => burst(innerWidth / 2, innerHeight / 3, 50), 600);
</script>
